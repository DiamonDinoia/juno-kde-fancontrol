# Shipped by juno-kde-fancontrol. Sorts after any legacy 10-/20- drop-in in
# /etc/systemd/system/fancontrol.service.d/, so the ExecStartPre reset below
# wins even when the older hand-installed overrides are still in place.
#
# hwmon indices drift across boots and fancontrol pins devices by literal
# hwmonN (ValidateDevices), so the config must be re-resolved before the
# daemon loads it. `fan-profile regen` rewrites /etc/fancontrol in place
# without restarting anything, which is safe inside ExecStartPre.
#
# The unit ships ProtectSystem=strict, so /etc is read-only for its processes.
# ReadWritePaths punches a hole for the one file regen has to write.
[Service]
Restart=always
RestartSec=5
ReadWritePaths=/etc/fancontrol
ExecStartPre=
ExecStartPre=/usr/bin/fan-profile regen
ExecStartPre=/usr/sbin/fancontrol --check
